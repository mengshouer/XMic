name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain from rust-toolchain.toml
        shell: pwsh
        run: |
          rustup toolchain install
          $active = (& rustup show active-toolchain) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not $active) {
            throw "Failed to activate the repository Rust toolchain"
          }
          Write-Output $active
          rustc --version
          cargo --version

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Test frontend and release tooling
        run: npm test

      - name: Build validated release assets
        run: npm run bundle

      - name: Verify release assets and runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = Join-Path (Get-Location) "artifacts/release"
          $payloads = @(
            "XMic_${version}_x64-setup.exe",
            "XMic.exe",
            "XMic_x64-portable.zip",
            "XMic_${version}_MPL-2.0-source.zip"
          )

          $expectedSet = @($payloads + "SHA256SUMS.txt" | Sort-Object)
          $actualSet = @(Get-ChildItem -LiteralPath $release -File |
            ForEach-Object Name | Sort-Object)
          if (Compare-Object $expectedSet $actualSet) {
            throw "Release payload set mismatch: $($actualSet -join ', ')"
          }

          $checksumLines = @(Get-Content -LiteralPath (
            Join-Path $release "SHA256SUMS.txt"))
          if ($checksumLines.Count -ne $payloads.Count) {
            throw "SHA256SUMS.txt does not list every payload"
          }
          foreach ($payload in $payloads) {
            $payloadPath = Join-Path $release $payload
            $expectedHash = (Get-FileHash -LiteralPath $payloadPath -Algorithm SHA256).
              Hash.ToLowerInvariant()
            $line = $checksumLines | Where-Object { $_ -like "*  $payload" }
            if (-not $line -or -not $line.StartsWith($expectedHash)) {
              throw "Checksum mismatch for $payload"
            }
          }

          function Invoke-RuntimeSelfTest([string]$Directory, [string]$Mode) {
            $reportPath = Join-Path $Directory "self-test.json"
            $process = Start-Process -FilePath (Join-Path $Directory "XMic.exe") `
              -ArgumentList @("--runtime-self-test", $reportPath) -Wait -PassThru `
              -WorkingDirectory $Directory
            if ($process.ExitCode -ne 0) {
              throw "runtime self-test exited with $($process.ExitCode) in $Mode mode"
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            if ($report.diagnostics.mode -ne $Mode) {
              throw "runtime self-test reported mode $($report.diagnostics.mode), expected $Mode"
            }
            if ($report.diagnostics.dspSource -ne "embedded") {
              throw "runtime self-test did not select the embedded DSP"
            }
            if (-not $report.diagnostics.dspSelectionPinned) {
              throw "runtime self-test did not pin the selected DSP"
            }
            if (-not $report.embeddedLibraryMatches) {
              throw "managed DSP copy does not match the embedded bytes"
            }
            if (-not $report.currentRuntimeCleaned) {
              throw "runtime self-test left its run directory behind"
            }
            if ($report.diagnostics.actualDspAbi -ne $report.diagnostics.expectedDspAbi) {
              throw "runtime self-test ABI mismatch"
            }
            Write-Output "$Mode self-test: $($report.diagnostics.dataDirectory)"
          }

          $standalone = Join-Path $env:RUNNER_TEMP "xmic-standalone"
          Remove-Item -LiteralPath $standalone -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $standalone -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $release "XMic.exe") -Destination $standalone
          Invoke-RuntimeSelfTest $standalone "standard"

          $portable = Join-Path $env:RUNNER_TEMP "xmic-portable"
          Remove-Item -LiteralPath $portable -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath (Join-Path $release "XMic_x64-portable.zip") `
            -DestinationPath $portable
          $portableRoot = Join-Path $portable "XMic_x64-portable"
          $expectedEntries = @(
            "XMic.exe",
            "portable.flag",
            "data"
          )
          $actualEntries = @(Get-ChildItem -LiteralPath $portableRoot |
            ForEach-Object Name | Sort-Object)
          if (Compare-Object $expectedEntries $actualEntries) {
            throw "Portable archive layout mismatch: $($actualEntries -join ', ')"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $portableRoot "data") -PathType Container)) {
            throw "Portable archive is missing its data directory"
          }
          Invoke-RuntimeSelfTest $portableRoot "portable"
          $runtimeRoot = Join-Path $portableRoot "data/runtime"
          if (-not (Test-Path -LiteralPath $runtimeRoot -PathType Container)) {
            throw "Portable runtime directory was not created under data/"
          }
          $leftovers = @(Get-ChildItem -LiteralPath $runtimeRoot -Directory)
          if ($leftovers.Count -ne 0) {
            throw "Portable runtime directory kept run folders: $($leftovers.Name -join ', ')"
          }

          $sourceZip = Join-Path $release "XMic_${version}_MPL-2.0-source.zip"
          $sourceExtract = Join-Path $env:RUNNER_TEMP "xmic-mpl-source"
          Remove-Item -LiteralPath $sourceExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $sourceExtract
          foreach ($required in @("MPL_SOURCE_CODE.txt", "LICENSE-MPL-2.0.txt", "sources")) {
            if (-not (Test-Path -LiteralPath (Join-Path $sourceExtract $required))) {
              throw "MPL source archive is missing $required"
            }
          }
