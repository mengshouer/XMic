name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Audit and build release
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Release workflow must run from the main branch"
          }

          $prevErrorAction = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $versionOutput = (& node scripts/check-release-version.mjs --print 2>&1 | Out-String).Trim()
          $versionExit = $LASTEXITCODE
          $ErrorActionPreference = $prevErrorAction
          $global:LASTEXITCODE = 0
          if ($versionExit -ne 0 -or $versionOutput -notmatch '^\d+\.\d+\.\d+$') {
            throw "Failed to resolve a valid MAJOR.MINOR.PATCH release version: $versionOutput"
          }
          $version = $versionOutput
          $tag = "v$version"

          function Assert-GitHubEndpointMissing([string]$Endpoint, [string]$Label) {
            $savedErrorAction = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $output = (& gh api $Endpoint 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = $savedErrorAction
            $global:LASTEXITCODE = 0
            if ($exitCode -eq 0) {
              throw "$Label already exists. Run 'npm run version:bump -- <version|patch|minor|major>' before starting a new release."
            }
            if ($output -notmatch 'HTTP 404|Not Found') {
              throw "Failed to query $Endpoint (exit $exitCode): $($output.Trim())"
            }
          }

          Assert-GitHubEndpointMissing "repos/$env:GH_REPO/git/ref/tags/$tag" "Tag $tag"
          Assert-GitHubEndpointMissing "repos/$env:GH_REPO/releases/tags/$tag" "Release $tag"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Resolved release version: $version ($tag)"

      - name: Install Rust toolchain from rust-toolchain.toml
        shell: pwsh
        run: |
          rustup toolchain install
          $active = (& rustup show active-toolchain) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not $active) {
            throw "Failed to activate the repository Rust toolchain"
          }
          Write-Output $active
          rustc --version
          cargo --version

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Audit all npm dependencies
        run: npm audit --audit-level=high

      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@c6e5a961001f7be56eec4766ed45de261826a205 # cargo-audit
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Cargo dependencies
        run: cargo audit

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Test frontend and release tooling
        run: npm test

      - name: Build validated release assets
        run: npm run bundle

      - name: Verify release payload set and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -ne
              (Get-Content package.json -Raw | ConvertFrom-Json).version) {
            throw "Resolved version does not match the repository version"
          }
          $release = Join-Path (Get-Location) "artifacts/release"
          $payloads = @(
            "XMic_${env:RELEASE_VERSION}_x64-setup.exe",
            "XMic.exe",
            "XMic_x64-portable.zip",
            "XMic_${env:RELEASE_VERSION}_MPL-2.0-source.zip"
          )
          $expectedSet = @($payloads + "SHA256SUMS.txt" | Sort-Object)
          $actualSet = @(Get-ChildItem -LiteralPath $release -File |
            ForEach-Object Name | Sort-Object)
          if (Compare-Object $expectedSet $actualSet) {
            throw "Release payload set mismatch: $($actualSet -join ', ')"
          }
          $checksumLines = @(Get-Content -LiteralPath (
            Join-Path $release "SHA256SUMS.txt"))
          if ($checksumLines.Count -ne $payloads.Count) {
            throw "SHA256SUMS.txt does not list every payload"
          }
          foreach ($payload in $payloads) {
            $payloadPath = Join-Path $release $payload
            $expectedHash = (Get-FileHash -LiteralPath $payloadPath -Algorithm SHA256).
              Hash.ToLowerInvariant()
            $matches = @($checksumLines | Where-Object { $_ -match "  $([Regex]::Escape($payload))$" })
            if ($matches.Count -ne 1 -or -not $matches[0].StartsWith($expectedHash)) {
              throw "Checksum mismatch for $payload"
            }
          }

      - name: Smoke-test standalone and portable runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path (Get-Location) "artifacts/release"

          function Invoke-RuntimeSelfTest([string]$Directory, [string]$Mode) {
            $reportPath = Join-Path $Directory "self-test.json"
            $process = Start-Process -FilePath (Join-Path $Directory "XMic.exe") `
              -ArgumentList @("--runtime-self-test", $reportPath) -Wait -PassThru `
              -WorkingDirectory $Directory
            if ($process.ExitCode -ne 0) {
              throw "runtime self-test exited with $($process.ExitCode) in $Mode mode"
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            if ($report.diagnostics.mode -ne $Mode) {
              throw "runtime self-test reported mode $($report.diagnostics.mode), expected $Mode"
            }
            if ($report.diagnostics.dspSource -ne "embedded" -or
                -not $report.diagnostics.dspSelectionPinned -or
                -not $report.embeddedLibraryMatches -or
                -not $report.currentRuntimeCleaned) {
              throw "runtime self-test did not satisfy the embedded DSP contract"
            }
            if ($report.diagnostics.actualDspAbi -ne $report.diagnostics.expectedDspAbi) {
              throw "runtime self-test ABI mismatch"
            }
          }

          $standalone = Join-Path $env:RUNNER_TEMP "xmic-release-standalone"
          Remove-Item -LiteralPath $standalone -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $standalone -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $release "XMic.exe") -Destination $standalone
          Invoke-RuntimeSelfTest $standalone "standard"

          $portable = Join-Path $env:RUNNER_TEMP "xmic-release-portable"
          Remove-Item -LiteralPath $portable -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath (Join-Path $release "XMic_x64-portable.zip") -DestinationPath $portable
          $portableRoot = Join-Path $portable "XMic_x64-portable"
          $expectedEntries = @("XMic.exe", "portable.flag", "data")
          $actualEntries = @(Get-ChildItem -LiteralPath $portableRoot |
            ForEach-Object Name | Sort-Object)
          if (Compare-Object $expectedEntries $actualEntries) {
            throw "Portable archive layout mismatch: $($actualEntries -join ', ')"
          }
          Invoke-RuntimeSelfTest $portableRoot "portable"
          $leftovers = @(Get-ChildItem -LiteralPath (Join-Path $portableRoot "data/runtime") -Directory)
          if ($leftovers.Count -ne 0) {
            throw "Portable runtime directory kept run folders: $($leftovers.Name -join ', ')"
          }

          $sourceExtract = Join-Path $env:RUNNER_TEMP "xmic-release-mpl-source"
          Remove-Item -LiteralPath $sourceExtract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath (
            Join-Path $release "XMic_${env:RELEASE_VERSION}_MPL-2.0-source.zip") `
            -DestinationPath $sourceExtract
          foreach ($required in @("MPL_SOURCE_CODE.txt", "LICENSE-MPL-2.0.txt", "sources")) {
            if (-not (Test-Path -LiteralPath (Join-Path $sourceExtract $required))) {
              throw "MPL source archive is missing $required"
            }
          }

      - name: Attest release payload provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/XMic_${{ steps.version.outputs.version }}_x64-setup.exe
            artifacts/release/XMic.exe
            artifacts/release/XMic_x64-portable.zip
            artifacts/release/XMic_${{ steps.version.outputs.version }}_MPL-2.0-source.zip

      - name: Upload validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts/release

      - name: Verify downloaded release payloads
        working-directory: artifacts/release
        run: |
          set -euo pipefail

          sha256sum --check --strict SHA256SUMS.txt

          expected=$(printf '%s\n' \
            "SHA256SUMS.txt" \
            "XMic.exe" \
            "XMic_${RELEASE_VERSION}_MPL-2.0-source.zip" \
            "XMic_${RELEASE_VERSION}_x64-setup.exe" \
            "XMic_x64-portable.zip")
          actual=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Release payload set mismatch"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

          checksum_entries=$(awk '{ print $2 }' SHA256SUMS.txt | sort)
          if [ "$checksum_entries" != "$(printf '%s\n' \
            "XMic.exe" \
            "XMic_${RELEASE_VERSION}_MPL-2.0-source.zip" \
            "XMic_${RELEASE_VERSION}_x64-setup.exe" \
            "XMic_x64-portable.zip")" ]; then
            echo "::error::SHA256SUMS.txt does not cover exactly the release payloads"
            exit 1
          fi

      - name: Create tag and draft release
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          generated_notes=$(gh api \
            --method POST \
            "repos/$GH_REPO/releases/generate-notes" \
            --raw-field tag_name="$RELEASE_TAG" \
            --raw-field target_commitish="$RELEASE_SHA" \
            --jq '.body // ""')
          {
            echo "> [!WARNING]"
            echo "> The Windows installer, the standalone executable, and the portable archive are all unsigned. Verify them with SHA256SUMS.txt before running; Windows SmartScreen may show an unknown publisher warning."
            echo "> The standalone and portable editions require the system Microsoft Edge WebView2 Evergreen Runtime."
            echo
            printf '%s\n' "$generated_notes"
          } > "$notes_file"

          gh api --method POST "repos/$GH_REPO/git/refs" \
            --raw-field ref="refs/tags/$RELEASE_TAG" \
            --raw-field sha="$RELEASE_SHA" > /dev/null

          gh release create "$RELEASE_TAG" artifacts/release/* \
            --draft \
            --notes-file "$notes_file" \
            --title "XMic $RELEASE_TAG" \
            --verify-tag
