name: Scheduled security audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Audit all npm dependency severities
        run: npm audit --audit-level=moderate

      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@c6e5a961001f7be56eec4766ed45de261826a205 # cargo-audit
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Cargo dependencies
        run: cargo audit
