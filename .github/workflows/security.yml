name: Scheduled security audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Audit all npm dependency severities
        run: npm audit --audit-level=moderate

      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@c6e5a961001f7be56eec4766ed45de261826a205 # cargo-audit
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Cargo dependencies
        run: cargo audit
