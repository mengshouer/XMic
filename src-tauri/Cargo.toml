[package]
name = "xmic"
version.workspace = true
description = "Local Windows microphone processing with AEC3 and RNNoise"
edition = "2021"
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xmic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rtrb.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
windows.workspace = true
xmic-engine-core = { path = "../crates/engine-core" }
xmic-engine-protocol = { path = "../crates/engine-protocol" }
xmic-engine-runtime = { path = "../crates/engine-runtime" }
xmic-platform-api = { path = "../crates/platform-api" }
xmic-platform-windows = { path = "../crates/platform-windows" }
xmic-rnnoise-dsp = { path = "../crates/rnnoise-dsp" }
xmic-webrtc-dsp = { path = "../crates/webrtc-dsp" }
